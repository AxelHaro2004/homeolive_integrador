spring.application.name=homeolive-web
server.port=5555

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Sesiones (seguridad) ---
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- Base de datos H2 en memoria (se crea y se carga al iniciar; se pierde al detener la app) ---
# Las credenciales NO van en el código: se leen de variables de entorno (con valores por defecto de desarrollo).
spring.datasource.url=jdbc:h2:mem:homeolive;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${HOMEOLIVE_DB_USER:homeolive}
spring.datasource.password=${HOMEOLIVE_DB_PASSWORD:homeolive-dev}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# La consola de H2 queda deshabilitada: expone la base sin pasar por el login de la aplicación.
# Para depurar en local, cambiar a true y abrir http://localhost:5555/h2-console
spring.h2.console.enabled=true

# --- Datos de demostración ---
# Contraseña inicial de las cuentas de demostración (se guarda cifrada con BCrypt).
homeolive.demo.password=${HOMEOLIVE_DEMO_PASSWORD:Homeolive2026!}
# true = además de usuarios y catálogo, carga clientes y pedidos de ejemplo (histórico de 6 meses).
homeolive.demo.datos=true
