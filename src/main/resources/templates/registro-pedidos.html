<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${vista}, ~{::contenido})}">
<body>
<th:block th:fragment="contenido">

  <th:block th:replace="~{fragments/componentes :: avisos}"></th:block>

  <form id="form-pedido" th:action="@{/registro-pedidos}" method="post"
        th:attr="data-lineas=${lineasJson}" data-lineas="[]">
    <div class="form-layout">
      <section class="card form-card">
        <div class="form-section-title">
          <span>01</span>
          <div><h3>Datos del pedido</h3><p>Identificación automática de la operación</p></div>
        </div>
        <div class="fields-grid two">
          <label class="field"><span>N° de pedido</span><input class="readonly" readonly="readonly" th:value="${numeroPedido}" value="PED-1049"/><small>Vista previa: el número definitivo se asigna al guardar</small></label>
          <label class="field"><span>N° de venta</span><input class="readonly" readonly="readonly" th:value="${numeroVenta}" value="VEN-5082"/><small>Se genera automáticamente</small></label>
        </div>
      </section>

      <section class="card form-card">
        <div class="form-section-title">
          <span>02</span>
          <div><h3>Datos del cliente</h3><p>Información de contacto y entrega</p></div>
        </div>
        <div class="fields-grid two">
          <label class="field"><span>Nombre y apellidos</span><input name="nombre" maxlength="100" placeholder="Ej. Rosa Martínez López" required="required" th:value="${nombre}"/></label>
          <label class="field"><span>DNI</span><input id="dni" name="dni" maxlength="8" minlength="8" inputmode="numeric" pattern="[0-9]{8}" placeholder="8 dígitos" required="required" th:value="${dni}"/></label>
          <label class="field"><span>Teléfono</span><input name="telefono" maxlength="15" inputmode="tel" placeholder="999 999 999" required="required" th:value="${telefono}"/></label>
          <label class="field">
            <span>Ubicación de entrega</span>
            <select id="ubicacion" name="ubicacion">
              <option value="Lima" th:selected="${ubicacionElegida != 'Provincia'}">Lima</option>
              <option value="Provincia" th:selected="${ubicacionElegida == 'Provincia'}">Provincia</option>
            </select>
          </label>
          <label class="field">
            <span>Tipo de envío</span>
            <select id="tipo-envio" name="envio">
              <option value="Motorizado" th:selected="${envioElegido == 'Motorizado'}">Motorizado</option>
              <option value="Olva" th:selected="${envioElegido == 'Olva'}">Olva</option>
              <option value="Shalom" th:selected="${envioElegido == 'Shalom'}">Shalom</option>
            </select>
            <small>El pago del envío lo gestiona el cliente (contraentrega).</small>
          </label>
        </div>
      </section>

      <section class="card form-card full">
        <div class="form-section-title items-heading">
          <span>03</span>
          <div><h3>Ítems del pedido</h3><p>Categoría y presentación del catálogo; el producto lo escribes tú</p></div>
          <button type="button" id="agregar-item" class="button button-secondary">
            <svg th:replace="~{fragments/iconos :: icono('plus', 17)}"></svg>
            Agregar ítem
          </button>
        </div>

        <div class="items-list" id="lista-items">
          <div class="item-row" data-fila-catalogo="">
            <span class="item-index">01</span>
            <label class="field">
              <span>Categoría</span>
              <select data-campo="categoria" required="required"><option value="">Cargando…</option></select>
            </label>
            <label class="field">
              <span>Producto</span>
              <input name="producto" maxlength="100" placeholder="Ej. Calma Kids"
                     title="Escribe el nombre del producto. Si la categoría ya es el producto (Spirulina, Omega 3) puedes dejarlo vacío."/>
            </label>
            <label class="field">
              <span>Presentación</span>
              <select data-campo="presentacion" name="presentacion" required="required"><option value="">Selecciona categoría</option></select>
            </label>
            <label class="field"><span>Cantidad</span><input name="cantidad" type="number" min="1" max="999" value="1" required="required"/></label>
            <button type="button" class="remove-item" aria-label="Eliminar ítem" disabled="disabled">
              <svg th:replace="~{fragments/iconos :: icono('trash', 18)}"></svg>
            </button>
          </div>
        </div>

        <label class="check-field pay-check">
          <input type="checkbox" name="pago" value="true" required="required" th:checked="${pagoMarcado}"/>
          <span>Confirmo que el cliente ya realizó el pago. El pedido solo se genera cuando el pago está hecho.</span>
        </label>

        <div class="form-actions">
          <span id="contador-items">1 ítem en el pedido</span>
          <button type="submit" class="button button-primary">
            Registrar pedido
            <svg th:replace="~{fragments/iconos :: icono('chevron', 18)}"></svg>
          </button>
        </div>
      </section>
    </div>
  </form>

</th:block>
</body>
</html>
