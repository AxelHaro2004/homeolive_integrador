<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="aside(rol, activa)" class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <img th:src="@{/img/curenci-logo.jpg}" alt="Curenci"/>
  </div>

  <div class="sidebar-profile">
    <div class="avatar" th:text="${rol.iniciales()}">AV</div>
    <div>
      <strong th:text="${rol.nombreCompleto()}">Andrea Ramírez</strong>
      <span th:text="${rol.etiqueta()}">Vendedor</span>
    </div>
  </div>

  <nav>
    <p class="nav-caption">MENÚ PRINCIPAL</p>
    <a th:each="v : ${rol.vistas()}"
       th:href="@{${v.ruta()}}"
       th:classappend="${v == activa} ? 'nav-active'"
       th:title="${v.etiquetaMenu()}">
      <svg th:replace="~{fragments/iconos :: icono(${v.icono()}, 18)}"></svg>
      <span th:text="${v.etiquetaMenu()}">Inicio</span>
    </a>
  </nav>

  <a class="logout-button" th:href="@{/logout}">
    <svg th:replace="~{fragments/iconos :: icono('logout', 18)}"></svg>
    <span>Cerrar sesión</span>
  </a>
</aside>

</body>
</html>
